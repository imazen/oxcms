[workspace]
resolver = "2"
members = [
    "crates/oxcms-core",
    "crates/cms-tests",
    "crates/skcms-sys",
    "crates/argyll-sys",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/user/oxcms"

[workspace.dependencies]
# Core dependencies - using patched local version with relaxed version parsing
moxcms = { path = "external/moxcms", features = ["options"] }
lcms2 = "6.2.0"
qcms = "0.3.0"
skcms-sys = { path = "crates/skcms-sys" }
argyll-sys = { path = "crates/argyll-sys" }

# Color science
palette = "0.7.7"
colorutils-rs = "0.7.6"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
zenbench = "0.1.10"

# Error handling
thiserror = "1"
anyhow = "1.0.104"

# Byte manipulation
bytemuck = { version = "1.25.2", features = ["derive"] }

# Random for tests
rand = "0.8"
rand_chacha = "0.3"

# Async
rayon = "1.12.0"

# SIMD multiversioning
multiversion = "0.7"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
lto = true
codegen-units = 1
